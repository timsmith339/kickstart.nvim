<style>

  html, body { height:100%; overflow:hidden; }

    overscroll-behavior:none;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    image-rendering:pixelated;
    image-rendering:crisp-edges;

  }
  /* ---- touch controls ---- */
  .btn {
    position:fixed; z-index:20;

    font-size:20px; color:#e8d5a9;

  #bR { left:86px;  bottom:calc(18px + env(safe-area-inset-bottom)); }
  #bAtk { right:14px; bottom:calc(18px + env(safe-area-inset-bottom)); width:70px; height:70px; font-size:24px; }
  #bAct { right:98px; bottom:calc(18px + env(safe-area-inset-bottom)); }

  #ctxlbl {

    pointer-events:none; width:80px; text-align:center;
  }
  #mute {
    position:fixed; z-index:20; top:calc(6px + env(safe-area-inset-top)); right:8px;
    width:34px; height:34px; font-size:12px;
  }
  .hidden { display:none !important; }
  /* ---- overlays ---- */
  .overlay {
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center;
    background:rgba(12,10,20,.82);
    padding:16px;
  }
  .title-big {
    font-size:clamp(22px,6vw,44px);
    color:#ffb347;
    text-shadow:3px 3px 0 #6b2f1f, 6px 6px 0 #0c0a14;
    letter-spacing:2px;
  }
  .sub { font-size:clamp(8px,2.4vw,11px); line-height:1.9; color:#c9b891; max-width:520px; }
  .blink { font-size:clamp(10px,3vw,14px); color:#fff; animation:blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation:none; } }
  .stat { font-size:clamp(9px,2.6vw,12px); color:#e8d5a9; line-height:2; }
  /* ---- workbench panel ---- */
  #panel {
    position:fixed; z-index:40; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(12,10,20,.7);
  }
  #panelbox {
    width:min(94vw,560px); max-height:88vh; overflow-y:auto;
    background:#241d16;
    border:3px solid #8a6b3f;
    box-shadow:0 0 0 3px #0c0a14, 0 0 0 6px #4a3826;
    padding:14px;
  }
  #panelbox h2 { font-size:13px; color:#ffb347; margin-bottom:4px; }
  #panelbox .res { font-size:9px; margin:8px 0 12px; line-height:1.8; }
  .chip { display:inline-block; padding:1px 4px; margin-right:4px; font-size:8px; }
  .cw { color:#c98a4b; } .cs { color:#b0a494; } .cc { color:#5fe0d8; }
  .row {
    display:flex; align-items:center; gap:8px;
    border-top:2px solid #3a2f22;
    padding:9px 0;
  }
  .row .info { flex:1; min-width:0; }
  .row .nm { font-size:9px; color:#e8d5a9; }
  .row .nm .lv { color:#ffb347; }
  .row .ds { font-size:7px; color:#9a8a6b; margin-top:5px; line-height:1.7; }

    font-family:'Press Start 2P', monospace; font-size:8px;

  #closeP {

    background:none; border:2px solid #8a6b3f; color:#e8d5a9;
    padding:6px 9px; cursor:pointer;
  }
  #rot { position:fixed; z-index:25; left:0; right:0; bottom:2px; text-align:center;
    font-size:7px; color:#6b5f4a; pointer-events:none; }

<script>
'use strict';
/* ============================================================
   STONESLINGER — pixel side-scroller base-defense
   ============================================================ */
const IW=384, IH=216, GROUND=178, WORLD=1920, BASE_X=960;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

function resize(){
  const aw=innerWidth, ah=innerHeight;
  let s=Math.min(aw/IW, ah/IH);
  if(s>1) s=Math.max(1, Math.floor(s*2)/2); // half-integer steps stay crisp
  cv.style.width=(IW*s)+'px'; cv.style.height=(IH*s)+'px';
  document.getElementById('rot').textContent =
    (ah>aw*1.2) ? 'TIP: LANDSCAPE IS COMFIER' : '';
}
addEventListener('resize', resize); resize();

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const F=x=>Math.round(x);
let shake=0;

/* ---------- audio ---------- */
let AC=null, muted=false;
function beep(f0,f1,dur,type,vol){
  if(muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.07,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
const SFX={
  rock:  ()=>beep(300,160,0.09),
  sling: ()=>beep(430,240,0.08),
  caster:()=>beep(150,55,0.16,'sawtooth',0.09),
  auto:  ()=>beep(520,330,0.045,'square',0.05),
  hit:   ()=>beep(130,60,0.06,'sawtooth',0.06),
  gather:()=>beep(230,340,0.06,'triangle',0.08),
  store: ()=>beep(440,660,0.13,'triangle',0.08),
  craft: ()=>beep(330,660,0.22,'square',0.08),
  hurt:  ()=>beep(210,70,0.2,'sawtooth',0.1),
  edie:  ()=>beep(95,40,0.12,'square',0.07),
  wave:  ()=>beep(110,220,0.45,'square',0.09),
  denied:()=>beep(150,110,0.1,'square',0.05),
  fall:  ()=>beep(300,40,0.9,'sawtooth',0.12),
};
document.getElementById('mute').addEventListener('pointerdown',e=>{
  e.stopPropagation(); muted=!muted;
  document.getElementById('mute').textContent = muted?'×':'♬';
});

/* ---------- sprites ---------- */
function mkSpr(rows,pal){
  const px=[];
  rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const c=r[x];
    if(c!=='.'&&pal[c]) px.push([x,y,pal[c]]); }});
  return {w:rows[0].length,h:rows.length,px};
}
function drawSpr(s,x,y,flip){
  x=F(x); y=F(y);
  for(let i=0;i<s.px.length;i++){ const p=s.px[i];
    ctx.fillStyle=p[2];
    ctx.fillRect(x+(flip?s.w-1-p[0]:p[0]), y+p[1], 1,1);
  }
}

/* ---------- weapons ---------- */
const WDEF={
  rock:  {name:'THROWN ROCK', dmg:1.5, rate:1.4, spd:150, grav:230, life:1.1, size:2, col:'#9a8f80',
          craft:null, up:{wood:4,stone:6}, desc:'THE CLASSIC. IT IS A ROCK.'},
  sling: {name:'SLINGSHOT', dmg:2.6, rate:2.2, spd:225, grav:95, life:1.3, size:2, col:'#c8b89a',
          craft:{wood:12,stone:8}, up:{wood:8,stone:10}, desc:'FASTER, STRONGER ROCKS.'},
  caster:{name:'ROCK CASTER', dmg:8, rate:0.8, spd:135, grav:180, life:0.95, size:4, col:'#b0a494',
          craft:{wood:30,stone:40}, up:{wood:14,stone:18}, desc:'HURLS BOULDERS. SLOW + SHORT... AT FIRST.'},
  auto:  {name:'AUTO-SLINGER', dmg:1.9, rate:6.5, spd:285, grav:28, life:1.15, size:2, col:'#ffd98a',
          craft:{wood:70,stone:90,crystal:8}, up:{wood:20,stone:26,crystal:2}, desc:'FULL-AUTO PEBBLE STORM.'},
};
const WORDER=['rock','sling','caster','auto'];
const MAXLV=7;
function wstats(id){
  const d=WDEF[id], L=(G.levels[id]||1)-1;
  return {
    id, name:d.name, col:d.col, size:d.size, grav:d.grav,
    dmg:d.dmg*(1+0.30*L),
    rate:d.rate*(1+0.18*L),
    spd:d.spd*(1+0.10*L),
    life:d.life*(1+0.06*L),
  };
}
function upCost(id){
  const b=WDEF[id].up, m=Math.pow(1.7,(G.levels[id]||1)-1), c={};
  for(const k in b) c[k]=Math.ceil(b[k]*m);
  return c;
}

/* ---------- game state ---------- */
let G={};
let state='title';
let best=0;
try{ best=parseInt(localStorage.getItem('stoneslinger_best')||'0',10)||0; }catch(e){}

function initGame(){
  G={
    t:0, cam:0, kills:0,
    player:{x:BASE_X-20, y:GROUND, hp:20, maxhp:20, face:1, cool:0, anim:0,
            inv:0, dead:0, harvT:0, push:0, hurtT:99},
    stored:{wood:0, stone:0, crystal:0},
    carried:{wood:0, stone:0, crystal:0},
    cap:10, capLv:0,
    levels:{rock:1, sling:0, caster:0, auto:0},
    cur:'rock',
    base:{hp:100, maxhp:100},
    nodes:[], enemies:[], projs:[], parts:[], pickups:[], floaters:[],
    wave:0, waveT:5, trickleT:9, burst:0, burstT:0,
    banner:null, over:false,
  };
  const N=(type,x)=>G.nodes.push({type,x,amount:type==='crystal'?4:6,max:type==='crystal'?4:6,t:0});
  [470,660,760,1180,1290,1450].forEach(x=>N('tree',x));
  [300,560,860,1080,1360,1620].forEach(x=>N('rock',x));
  [130,240,1680,1800].forEach(x=>N('crystal',x));
}
initGame();

/* ---------- input ---------- */
const input={left:0,right:0,attack:0,action:0};
let actionEdge=false, prevAction=0;
function bindBtn(id,name,tap){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    el.classList.add('pressed');
    if(tap) tap(); else input[name]=1;
  });
  const off=e=>{ el.classList.remove('pressed'); if(!tap) input[name]=0; };
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
}
bindBtn('bL','left'); bindBtn('bR','right');
bindBtn('bAtk','attack'); bindBtn('bAct','action');
bindBtn('bSwap',null,()=>swapWeapon());
const KEY={a:'left',arrowleft:'left',d:'right',arrowright:'right',
           j:'attack',x:'attack',' ':'attack',k:'action',e:'action',arrowup:'action',z:'action'};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(KEY[k]!==undefined){ input[KEY[k]]=1; e.preventDefault(); }
  if(k==='q') swapWeapon();
  if(k==='escape') closePanel();
});
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(KEY[k]!==undefined) input[KEY[k]]=0; });
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>{ if(AC&&AC.state==='suspended')AC.resume(); });

document.getElementById('titleO').addEventListener('pointerdown',()=>{
  document.getElementById('titleO').classList.add('hidden');
  state='play'; beep(220,440,0.2,'triangle',0.08);
});
document.getElementById('overO').addEventListener('pointerdown',()=>{
  document.getElementById('overO').classList.add('hidden');
  initGame(); refreshSwapBtn(); state='play';
});

/* ---------- helpers ---------- */
function floater(x,y,txt,col){ G.floaters.push({x,y,txt,col:col||'#fff',t:1.2}); }
function burstParts(x,y,col,n,pow){
  for(let i=0;i<n;i++) G.parts.push({x,y,vx:rnd(-1,1)*(pow||40),vy:rnd(-1.2,-0.2)*(pow||40),t:rnd(0.25,0.6),col});
}
function carriedTotal(){ return G.carried.wood+G.carried.stone+G.carried.crystal; }
function canAfford(cost){ for(const k in cost) if((G.stored[k]||0)<cost[k]) return false; return true; }
function pay(cost){ for(const k in cost) G.stored[k]-=cost[k]; }
function costTxt(cost){
  const s=[]; if(cost.wood)s.push(cost.wood+' WOOD'); if(cost.stone)s.push(cost.stone+' STONE');
  if(cost.crystal)s.push(cost.crystal+' CRYSTAL'); return s.join(' + ');
}
function owned(){ return WORDER.filter(id=>G.levels[id]>0); }
function swapWeapon(){
  const o=owned(); if(o.length<2) return;
  G.cur=o[(o.indexOf(G.cur)+1)%o.length];
  floater(G.player.x,GROUND-24,wstats(G.cur).name,'#ffb347');
  beep(330,440,0.06,'triangle',0.06);
}
function refreshSwapBtn(){
  document.getElementById('bSwap').style.display = owned().length>1?'flex':'none';
}

/* ---------- combat ---------- */
function fire(){
  const w=wstats(G.cur), p=G.player;
  const px=p.x, py=GROUND-14;
  const range=w.spd*w.life*0.85+30;
  let tgt=null, bd=1e9;
  for(const e of G.enemies){
    const d=Math.hypot(e.x-px, e.cy-py);
    if(d<range && d<bd){ bd=d; tgt=e; }
  }
  let vx,vy;
  if(tgt){
    const dx=tgt.x-px, dy=tgt.cy-py;
    const t=Math.max(0.14, Math.hypot(dx,dy)/w.spd);
    vx=dx/t; vy=dy/t - 0.5*w.grav*t;
    p.face = dx<0?-1:1;
  }else{
    vx=p.face*w.spd; vy=-w.grav*0.16-8;
  }
  G.projs.push({x:px,y:py,vx,vy,g:w.grav,dmg:w.dmg,life:w.life,size:w.size,col:w.col});
  (SFX[G.cur]||SFX.rock)();
  p.cool=1/w.rate;
}
function spawnEnemy(){
  if(G.enemies.length>=22) return;
  const w=G.wave;
  let type='grub';
  const r=Math.random();
  if(w>=3 && r<0.28) type='brute';
  else if(w>=5 && r<0.52) type='bat';
  const side=Math.random()<0.5?-1:1;
  let x=BASE_X + side*(250+Math.random()*160);
  const camL=G.cam-25, camR=G.cam+IW+25;
  if(x>camL && x<camR) x = side>0 ? Math.max(x,camR) : Math.min(x,camL);
  x=clamp(x,10,WORLD-10);
  const hpMul=1+0.22*(w-1), dmgMul=1+0.08*(w-1), spdMul=1+0.02*w;
  const D={
    grub: {hp:4,  spd:21, dmg:4,  bdmg:4,  r:5, cd:1.0},
    brute:{hp:16, spd:11, dmg:9,  bdmg:11, r:7, cd:1.3},
    bat:  {hp:4,  spd:35, dmg:5,  bdmg:5,  r:5, cd:0.9},
  }[type];
  G.enemies.push({
    type, x, y: type==='bat'? GROUND-rnd(26,46) : GROUND,
    hp:D.hp*hpMul, maxhp:D.hp*hpMul,
    spd:D.spd*spdMul, dmg:D.dmg*dmgMul, bdmg:D.bdmg*dmgMul,
    r:D.r, cd:D.cd, atkT:rnd(0,0.5), flash:0, bob:rnd(0,6),
    get cy(){ return this.type==='bat'? this.y : GROUND-4; },
  });
}
function killEnemy(e){
  G.kills++;
  burstParts(e.x,e.cy, e.type==='grub'?'#5a9e3c':e.type==='bat'?'#7a5296':'#7d7468', 10, 55);
  SFX.edie();
  const r=Math.random();
  if(r<0.22) G.pickups.push({x:e.x,y:e.cy,type:'stone',t:30});
  else if(r<0.34) G.pickups.push({x:e.x,y:e.cy,type:'wood',t:30});
  else if(G.wave>=4 && r<0.42) G.pickups.push({x:e.x,y:e.cy,type:'crystal',t:30});
}
function hurtPlayer(dmg,fromX){
  const p=G.player;
  if(p.inv>0||p.dead) return;
  p.hp-=dmg; p.inv=0.9; p.hurtT=0;
  p.push = (p.x<fromX?-1:1)*70;
  shake=3; SFX.hurt();
  burstParts(p.x,GROUND-8,'#ff5a3c',6,50);
  if(p.hp<=0){
    p.dead=2.8; p.hp=0;
    if(carriedTotal()>0){
      G.pickups.push({x:p.x,y:GROUND-6,type:'bag',bag:{...G.carried},t:60});
      G.carried={wood:0,stone:0,crystal:0};
    }
    burstParts(p.x,GROUND-8,'#e0a878',14,70);
    floater(p.x,GROUND-30,'DOWN!','#ff5a3c');
  }
}

/* ---------- workbench panel ---------- */
const panelEl=document.getElementById('panel');
let panelOpen=false;
function openPanel(){ panelOpen=true; panelEl.classList.remove('hidden'); renderPanel(); }
function closePanel(){ panelOpen=false; panelEl.classList.add('hidden'); }
document.getElementById('closeP').addEventListener('pointerdown',e=>{ e.stopPropagation(); closePanel(); });

function chipHTML(cost){
  let h='';
  if(cost.wood)   h+='<span class="chip cw">'+cost.wood+' WOOD</span>';
  if(cost.stone)  h+='<span class="chip cs">'+cost.stone+' STONE</span>';
  if(cost.crystal)h+='<span class="chip cc">'+cost.crystal+' CRYSTAL</span>';
  return h;
}
function renderPanel(){
  document.getElementById('pRes').innerHTML =
    'STORED: <span class="cw">'+G.stored.wood+' WOOD</span> '+
    '<span class="cs">'+G.stored.stone+' STONE</span> '+
    '<span class="cc">'+G.stored.crystal+' CRYSTAL</span>';
  let h='';
  const row=(nm,ds,cost,act,ok,btn)=>{
    h+='<div class="row"><div class="info"><div class="nm">'+nm+'</div>'+
       '<div class="ds">'+ds+(cost?'<br>'+chipHTML(cost):'')+'</div></div>'+
       '<button class="buy" data-act="'+act+'"'+(ok?'':' disabled')+'>'+btn+'</button></div>';
  };
  for(const id of WORDER){
    const d=WDEF[id], lv=G.levels[id];
    if(lv===0){
      row(d.name, d.desc, d.craft, 'craft:'+id, canAfford(d.craft), 'CRAFT');
    }else{
      const w=wstats(id);
      const st='DMG '+w.dmg.toFixed(1)+' / '+w.rate.toFixed(1)+' PER SEC / RANGE '+F(w.spd*w.life*0.85);
      if(lv>=MAXLV) row(d.name+' <span class="lv">LV '+lv+'</span>', st, null, 'x', false, 'MAX');
      else{
        const c=upCost(id);
        row(d.name+' <span class="lv">LV '+lv+'</span>',
            st+'<br>RESEARCH LV '+(lv+1)+': +DMG +RATE +RANGE', c,
            'up:'+id, canAfford(c), 'RESEARCH');
      }
    }
  }
  const rc={stone:12};
  row('REPAIR CAMP', 'PATCH THE WALLS. +25 CAMP HP.', rc, 'repair',
      canAfford(rc)&&G.base.hp<G.base.maxhp, 'REPAIR');
  const bc={wood:Math.ceil(20*Math.pow(1.6,G.capLv))};
  row('BIGGER BAG', 'CARRY +5 MORE LOOT. NOW: '+G.cap, bc, 'bag', canAfford(bc), 'SEW');
  document.getElementById('pRows').innerHTML=h;
  document.querySelectorAll('#pRows .buy').forEach(b=>{
    b.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); doBuy(b.dataset.act); });
  });
}
function doBuy(act){
  const [kind,id]=act.split(':');
  if(kind==='craft'){
    const c=WDEF[id].craft;
    if(!canAfford(c)) return SFX.denied();
    pay(c); G.levels[id]=1; G.cur=id;
    SFX.craft(); floater(BASE_X,GROUND-40,WDEF[id].name+'!','#ffb347');
    refreshSwapBtn();
  }else if(kind==='up'){
    const c=upCost(id);
    if(!canAfford(c)||G.levels[id]>=MAXLV) return SFX.denied();
    pay(c); G.levels[id]++;
    SFX.craft(); floater(BASE_X,GROUND-40,WDEF[id].name+' LV'+G.levels[id],'#ffb347');
  }else if(kind==='repair'){
    if(!canAfford({stone:12})||G.base.hp>=G.base.maxhp) return SFX.denied();
    pay({stone:12}); G.base.hp=Math.min(G.base.maxhp,G.base.hp+25);
    SFX.craft(); floater(BASE_X,GROUND-40,'+25 CAMP','#5a9e3c');
  }else if(kind==='bag'){
    const c={wood:Math.ceil(20*Math.pow(1.6,G.capLv))};
    if(!canAfford(c)) return SFX.denied();
    pay(c); G.capLv++; G.cap+=5;
    SFX.craft(); floater(BASE_X,GROUND-40,'BAG +5','#c98a4b');
  }
  renderPanel();
}

/* ---------- update ---------- */
const TIPS=[
  {at:1, txt:'HOLD ● TO THROW ROCKS'},
  {at:8, txt:'✦ NEAR TREES + ROCKS TO GATHER'},
  {at:16,txt:'CARRY LOOT HOME TO STORE IT'},
  {at:23,txt:'✦ AT THE FIRE TO OPEN WORKBENCH'},
];
function update(dt){
  G.t+=dt;
  const p=G.player;
  actionEdge = input.action && !prevAction;
  prevAction=input.action;

  /* --- player --- */
  if(p.dead>0){
    p.dead-=dt;
    if(p.dead<=0){ p.hp=p.maxhp; p.x=BASE_X; p.inv=2; }
  }else{
    let mv=(input.right?1:0)-(input.left?1:0);
    if(mv){ p.face=mv; p.anim+=dt*10; p.harvT=0; } else p.anim=0;
    p.x += mv*78*dt + p.push*dt;
    p.push*=Math.pow(0.001,dt);
    p.x=clamp(p.x,8,WORLD-8);
    p.inv=Math.max(0,p.inv-dt);
    p.hurtT+=dt;
    p.cool-=dt;
    if(input.attack && p.cool<=0) fire();

    /* near base? */
    const nearBase=Math.abs(p.x-BASE_X)<34;
    if(nearBase){
      if(carriedTotal()>0){
        for(const k in G.carried){ G.stored[k]+=G.carried[k]; G.carried[k]=0; }
        SFX.store(); floater(p.x,GROUND-28,'STORED!','#5fe0d8');
      }
      if(p.hurtT>4 && p.hp<p.maxhp) p.hp=Math.min(p.maxhp,p.hp+2.2*dt);
    }
    /* nearby node */
    let node=null;
    for(const n of G.nodes)
      if(n.amount>0 && Math.abs(n.x-p.x)<15){ node=n; break; }
    ctxLabel(node?'GATHER':(nearBase?'BUILD':''));
    if(node && input.action){
      p.harvT+=dt;
      if(p.harvT>=0.4){
        p.harvT=0; node.amount--;
        if(node.amount<=0) node.t=45;
        const res=node.type==='tree'?'wood':node.type==='rock'?'stone':'crystal';
        if(carriedTotal()<G.cap){
          G.carried[res]++;
          floater(p.x,GROUND-26,'+1 '+res.toUpperCase(),
            res==='wood'?'#c98a4b':res==='stone'?'#b0a494':'#5fe0d8');
        }else floater(p.x,GROUND-26,'BAG FULL!','#ff5a3c');
        SFX.gather();
        burstParts(node.x,GROUND-8,node.type==='tree'?'#5a9e3c':node.type==='rock'?'#8a8175':'#5fe0d8',5,35);
      }
    }else if(!input.action) p.harvT=0;
    if(actionEdge && !node && nearBase) openPanel();
  }

  /* --- node respawn --- */
  for(const n of G.nodes)
    if(n.amount<=0){ n.t-=dt; if(n.t<=0) n.amount=n.max; }

  /* --- spawner --- */
  G.waveT-=dt;
  if(G.waveT<=0){
    G.wave++;
    G.waveT=26;
    G.burst=Math.min(2+G.wave,14); G.burstT=0.1;
    G.banner={txt:'WAVE '+G.wave,t:2.2};
    SFX.wave();
  }
  if(G.burst>0){ G.burstT-=dt; if(G.burstT<=0){ G.burstT=0.65; G.burst--; spawnEnemy(); } }
  G.trickleT-=dt;
  if(G.trickleT<=0){ spawnEnemy(); G.trickleT=clamp(7-G.wave*0.35,2.2,7); }

  /* --- enemies --- */
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    e.flash=Math.max(0,e.flash-dt); e.atkT-=dt; e.bob+=dt*6;
    const pAlive=!(p.dead>0);
    if(e.type==='bat'){
      const tx = pAlive? p.x : BASE_X;
      const ty = pAlive? GROUND-9 : GROUND-14;
      const dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy)||1;
      e.x+=dx/d*e.spd*dt; e.y+=dy/d*e.spd*dt + Math.sin(e.bob)*10*dt;
      e.y=clamp(e.y,GROUND-70,GROUND-4);
      if(pAlive && Math.abs(e.x-p.x)<8 && Math.abs(e.y-(GROUND-9))<9 && e.atkT<=0){
        e.atkT=e.cd; hurtPlayer(e.dmg,e.x);
      }
      if(!pAlive && Math.abs(e.x-BASE_X)<20 && e.atkT<=0){
        e.atkT=e.cd; G.base.hp-=e.bdmg; shake=2; SFX.hit();
      }
    }else{
      const chasing = pAlive && Math.abs(p.x-e.x)<52;
      const tx=chasing?p.x:BASE_X, stop=chasing?7:32;
      const dx=tx-e.x;
      if(Math.abs(dx)>stop) e.x+=Math.sign(dx)*e.spd*dt;
      else if(e.atkT<=0){
        e.atkT=e.cd;
        if(chasing) hurtPlayer(e.dmg,e.x);
        else{ G.base.hp-=e.bdmg; shake=2.5; SFX.hit();
              burstParts(BASE_X+rnd(-14,14),GROUND-rnd(6,20),'#ffb347',4,40); }
      }
    }
    if(e.hp<=0){ killEnemy(e); G.enemies.splice(i,1); }
  }

  /* --- projectiles --- */
  for(let i=G.projs.length-1;i>=0;i--){
    const pr=G.projs[i];
    pr.vy+=pr.g*dt; pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt;
    let dead = pr.life<=0 || pr.x<-10 || pr.x>WORLD+10;
    if(pr.y>=GROUND-1){ burstParts(pr.x,GROUND-2,'#8a8175',3,25); dead=true; }
    if(!dead) for(const e of G.enemies){
      if(Math.abs(e.x-pr.x)<e.r+pr.size && Math.abs(e.cy-pr.y)<e.r+pr.size+2){
        e.hp-=pr.dmg; e.flash=0.1;
        e.x+=Math.sign(pr.vx)*2;
        floater(e.x,e.cy-8,''+Math.round(pr.dmg*10)/10,'#ffd98a');
        SFX.hit(); burstParts(pr.x,pr.y,'#fff',3,30);
        dead=true; break;
      }
    }
    if(dead) G.projs.splice(i,1);
  }

  /* --- pickups --- */
  for(let i=G.pickups.length-1;i>=0;i--){
    const k=G.pickups[i]; k.t-=dt;
    const d=Math.abs(k.x-p.x);
    if(!(p.dead>0) && d<14 && Math.abs((k.y||GROUND-6)-(GROUND-8))<20){
      if(k.type==='bag'){
        for(const r in k.bag){
          const take=Math.min(k.bag[r], G.cap-carriedTotal());
          G.carried[r]+=take;
        }
        floater(p.x,GROUND-26,'LOOT BACK!','#ffb347'); SFX.store();
        G.pickups.splice(i,1); continue;
      }
      if(carriedTotal()<G.cap){
        G.carried[k.type]++; SFX.gather();
        floater(p.x,GROUND-26,'+1 '+k.type.toUpperCase(),'#fff');
        G.pickups.splice(i,1); continue;
      }
    }
    if(k.t<=0) G.pickups.splice(i,1);
  }

  /* --- particles / floaters / banner --- */
  for(let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i]; q.t-=dt;
    q.vy+=200*dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(q.y>GROUND) { q.y=GROUND; q.vy*=-0.3; }
    if(q.t<=0) G.parts.splice(i,1);
  }
  for(let i=G.floaters.length-1;i>=0;i--){
    const f=G.floaters[i]; f.t-=dt; f.y-=14*dt;
    if(f.t<=0) G.floaters.splice(i,1);
  }
  if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0) G.banner=null; }
  shake=Math.max(0,shake-10*dt);

  /* --- camera --- */
  G.cam=clamp(p.x-IW/2, 0, WORLD-IW);

  /* --- game over --- */
  if(G.base.hp<=0 && !G.over){
    G.over=true; state='over'; SFX.fall();
    if(G.kills>best){ best=G.kills; try{localStorage.setItem('stoneslinger_best',''+best);}catch(e){} }
    document.getElementById('overStats').innerHTML=
      'SURVIVED '+G.wave+' WAVES &middot; '+Math.floor(G.t)+'S<br>'+
      G.kills+' FOES CRUSHED<br>BEST: '+best+' FOES';
    document.getElementById('overO').classList.remove('hidden');
  }
}
let lastLbl='';
function ctxLabel(s){
  if(s===lastLbl) return; lastLbl=s;
  document.getElementById('ctxlbl').textContent=s;
}

/* ---------- render ---------- */
function hillY(x,a,f,b){ return b+a*Math.sin(x*f)+a*0.5*Math.sin(x*f*2.7+2); }
function render(){
  const camX=F(G.cam + (shake? rnd(-shake,shake):0));
  const camY=F(shake? rnd(-shake,shake)*0.5:0);
  /* sky */
  const sky=['#161228','#1d1836','#2a2044','#3b2a4f'];
  for(let i=0;i<4;i++){ ctx.fillStyle=sky[i]; ctx.fillRect(0,i*34,IW,34); }
  ctx.fillStyle='#3b2a4f'; ctx.fillRect(0,136,IW,GROUND-136);
  /* stars + moon */
  ctx.fillStyle='#d8d4f0';
  for(let i=0;i<26;i++){
    const sx=(i*61+((i*i*13)%37)*7 - camX*0.08)%IW, sy=(i*37)%90+4;
    ctx.fillRect((sx+IW)%IW, sy, 1,1);
  }
  const mx=298,my=18;
  ctx.fillStyle='#e8e4d8';
  ctx.fillRect(mx+2,my,8,12); ctx.fillRect(mx,my+2,12,8); ctx.fillRect(mx+1,my+1,10,10);
  ctx.fillStyle='#c9c2b0';
  ctx.fillRect(mx+3,my+3,3,3); ctx.fillRect(mx+7,my+7,2,2); ctx.fillRect(mx+7,my+2,2,2);
  /* hills */
  for(let x=0;x<IW;x++){
    const wx1=x+camX*0.35, wx2=x+camX*0.6;
    ctx.fillStyle='#2c2547';
    ctx.fillRect(x, GROUND-hillY(wx1,16,0.012,44)+camY, 1, 200);
    ctx.fillStyle='#372e54';
    ctx.fillRect(x, GROUND-hillY(wx2,10,0.02,24)+camY, 1, 200);
  }
  /* ground */
  ctx.fillStyle='#4a7a3c'; ctx.fillRect(0,GROUND+camY,IW,3);
  ctx.fillStyle='#6b4a2f'; ctx.fillRect(0,GROUND+3+camY,IW,IH-GROUND-3);
  ctx.fillStyle='#5a3d26';
  for(let i=0;i<40;i++){
    const gx=(i*97+((i*i*29)%53)*5 - camX)%WORLD;
    const sx=gx-0;
    if(sx>-2&&sx<IW) ctx.fillRect(F(sx),GROUND+6+(i*13)%28+camY,2,1);
  }

  ctx.save(); ctx.translate(-camX,camY);

  /* nodes */
  for(const n of G.nodes){
    if(n.type==='tree'){
      if(n.amount>0) drawSpr(TREE,n.x-7,GROUND-13-9,false);
      else drawSpr(STUMP,n.x-3,GROUND-3,false);
    }else if(n.type==='rock'){
      if(n.amount>0) drawSpr(ROCKN,n.x-6,GROUND-5,false);
      else drawSpr(RUBBLE,n.x-6,GROUND-2,false);
    }else{
      if(n.amount>0){
        drawSpr(CRYST,n.x-4,GROUND-8,false);
        if(Math.sin(G.t*3+n.x)>0.7){ ctx.fillStyle='#d8fffb'; ctx.fillRect(n.x-3,GROUND-9,1,1); }
      }else drawSpr(RUBBLE,n.x-6,GROUND-2,false);
    }
    if(n.amount>0 && n.amount<n.max && Math.abs(n.x-G.player.x)<15){
      ctx.fillStyle='#0c0a14'; ctx.fillRect(n.x-6,GROUND-26,12,3);
      ctx.fillStyle='#ffb347'; ctx.fillRect(n.x-5,GROUND-25,Math.ceil(10*n.amount/n.max),1);
    }
  }

  /* base camp */
  drawBase();

  /* pickups */
  for(const k of G.pickups){
    const by=(k.y||GROUND-6)+Math.sin(G.t*4+k.x)*1.5;
    if(k.type==='bag') drawSpr(BAG,k.x-3,by-3,false);
    else drawSpr(ICONS[k.type],k.x-2,by-2,false);
  }

  /* enemies */
  for(const e of G.enemies){
    const spr=e.type==='grub'?GRUB:e.type==='brute'?BRUTE:BAT;
    const ex=e.x-spr.w/2;
    const ey=e.type==='bat'? e.y-spr.h/2 : GROUND-spr.h+(e.type==='grub'?Math.round(Math.sin(e.bob*2))*0:0);
    if(e.flash>0){
      ctx.fillStyle='#fff';
      for(const p2 of spr.px) ctx.fillRect(F(ex)+p2[0],F(ey)+p2[1],1,1);
    }else drawSpr(spr,ex,ey,e.x>G.player.x);
    if(e.hp<e.maxhp){
      ctx.fillStyle='#0c0a14'; ctx.fillRect(F(e.x)-5,F(ey)-4,10,2);
      ctx.fillStyle='#ff5a3c'; ctx.fillRect(F(e.x)-5,F(ey)-4,Math.max(1,Math.round(10*e.hp/e.maxhp)),2);
    }
  }

  /* player */
  const p=G.player;
  if(p.dead>0){
    ctx.fillStyle='#e0a878';
    ctx.fillRect(F(p.x)-5,GROUND-3,10,3);
  }else if(!(p.inv>0 && Math.floor(G.t*14)%2===0)){
    const spr=(input.left||input.right)&&Math.floor(p.anim)%2===0 ? HERO_B : HERO_A;
    drawSpr(spr, p.x-5, GROUND-12, p.face<0);
    if(carriedTotal()>0) drawSpr(BAG, p.x-(p.face<0?-2:8), GROUND-11, false);
  }

  /* projectiles */
  for(const pr of G.projs){
    ctx.fillStyle=pr.col;
    ctx.fillRect(F(pr.x)-pr.size/2, F(pr.y)-pr.size/2, pr.size, pr.size);
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.fillRect(F(pr.x-pr.vx*0.016), F(pr.y-pr.vy*0.016),1,1);
  }
  /* particles */
  for(const q of G.parts){ ctx.fillStyle=q.col; ctx.fillRect(F(q.x),F(q.y),1,1); }
  /* floaters */
  ctx.font='8px "Press Start 2P",monospace'; ctx.textBaseline='top';
  for(const f of G.floaters){
    ctx.globalAlpha=Math.min(1,f.t*2);
    ctx.fillStyle='#0c0a14'; ctx.fillText(f.txt,F(f.x)-f.txt.length*4+1,F(f.y)+1);
    ctx.fillStyle=f.col;     ctx.fillText(f.txt,F(f.x)-f.txt.length*4,F(f.y));
    ctx.globalAlpha=1;
  }
  ctx.restore();

  drawHUD();
}
function drawBase(){
  const bx=BASE_X, dmg=1-G.base.hp/G.base.maxhp;
  /* platform */
  ctx.fillStyle='#57503f'; ctx.fillRect(bx-30,GROUND-2,60,2);
  /* hut */
  ctx.fillStyle='#6b6157'; ctx.fillRect(bx-24,GROUND-22,34,20);
  ctx.fillStyle='#57503f';
  ctx.fillRect(bx-24,GROUND-22,34,1); ctx.fillRect(bx-10,GROUND-20,2,18);
  /* roof */
  ctx.fillStyle='#8a5a30';
  for(let i=0;i<7;i++) ctx.fillRect(bx-26+i,GROUND-23-i,38-2*i,1+(i===6?2:0));
  ctx.fillStyle='#6b431f'; ctx.fillRect(bx-26,GROUND-23,38,1);
  /* door + window */
  ctx.fillStyle='#43301c'; ctx.fillRect(bx-20,GROUND-14,7,12);
  ctx.fillStyle='#ffb347'; ctx.fillRect(bx-2,GROUND-17,5,4);
  /* cracks when damaged */
  if(dmg>0.4){ ctx.fillStyle='#3a352c';
    ctx.fillRect(bx+2,GROUND-12,1,6); ctx.fillRect(bx+3,GROUND-8,2,1);
    ctx.fillRect(bx-16,GROUND-20,1,4); }
  /* banner */
  ctx.fillStyle='#d8c9a0'; ctx.fillRect(bx+12,GROUND-38,1,16);
  const wv=Math.sin(G.t*4)>0?1:0;
  ctx.fillStyle='#ff5a3c'; ctx.fillRect(bx+13,GROUND-38,5+wv,4);
  /* campfire — size follows base HP */
  const fs=Math.max(1, Math.round(4*G.base.hp/G.base.maxhp));
  ctx.fillStyle='#43301c'; ctx.fillRect(bx+18,GROUND-2,8,2);
  for(let i=0;i<fs*2;i++){
    ctx.fillStyle=Math.random()<0.5?'#ffb347':'#ff5a3c';
    ctx.fillRect(bx+20+rnd(-1,3), GROUND-3-Math.random()*fs*2, 1+Math.round(Math.random()), 2);
  }
  if(Math.random()<0.15){ ctx.fillStyle='#8a7a5f'; ctx.fillRect(bx+21+rnd(-1,2),GROUND-8-rnd(0,6),1,1); }
  /* workbench */
  ctx.fillStyle='#8a5a30'; ctx.fillRect(bx-38,GROUND-6,10,2);
  ctx.fillStyle='#6b431f'; ctx.fillRect(bx-37,GROUND-4,2,4); ctx.fillRect(bx-31,GROUND-4,2,4);
  ctx.fillStyle='#b0a494'; ctx.fillRect(bx-36,GROUND-8,3,2);
}
function bar(x,y,w,frac,col){
  ctx.fillStyle='#0c0a14'; ctx.fillRect(x-1,y-1,w+2,6);
  ctx.fillStyle='#3a2f22'; ctx.fillRect(x,y,w,4);
  ctx.fillStyle=col; ctx.fillRect(x,y,Math.max(0,Math.round(w*frac)),4);
}
function drawHUD(){
  const p=G.player;
  ctx.font='8px "Press Start 2P",monospace'; ctx.textBaseline='top';
  /* hp + base */
  drawSpr(ICONS.heart,3,4,false);
  bar(9,4,42,p.hp/p.maxhp,'#ff5a3c');
  drawSpr(ICONS.home,58,4,false);
  bar(64,4,58,G.base.hp/G.base.maxhp, G.base.hp<30?'#ff5a3c':'#ffb347');
  /* wave + kills */
  ctx.fillStyle='#e8d5a9';
  const wtxt='WAVE '+Math.max(1,G.wave);
  ctx.fillText(wtxt, IW-4-wtxt.length*8, 3);
  ctx.fillStyle='#9a8a6b';
  const ktxt=G.kills+' KO';
  ctx.fillText(ktxt, IW-4-ktxt.length*8, 13);
  /* resources */
  let rx=4;
  const res=[['wood','#c98a4b'],['stone','#b0a494'],['crystal','#5fe0d8']];
  for(const [r,c] of res){
    drawSpr(ICONS[r],rx,15,false); rx+=7;
    ctx.fillStyle=c;
    const t=''+G.stored[r]+(G.carried[r]?'+'+G.carried[r]:'');
    ctx.fillText(t,rx,14); rx+=t.length*8+6;
  }
  /* bag */
  const ct=carriedTotal();
  if(ct>0){
    ctx.fillStyle=ct>=G.cap?'#ff5a3c':'#9a8a6b';
    ctx.fillText('BAG '+ct+'/'+G.cap, 4, 25);
  }
  /* weapon */
  const w=wstats(G.cur);
  ctx.fillStyle='#ffb347';
  const wt=w.name+' LV'+G.levels[G.cur];
  ctx.fillText(wt, F(IW/2-wt.length*4), IH-11);
  /* offscreen enemy arrows */
  ctx.fillStyle='#ff5a3c';
  let ls=false, rs=false;
  for(const e of G.enemies){
    if(e.x<G.cam-4) ls=true;
    if(e.x>G.cam+IW+4) rs=true;
  }
  if(ls && Math.floor(G.t*3)%2===0){ ctx.fillText('◀',2,GROUND-38); }
  if(rs && Math.floor(G.t*3)%2===0){ ctx.fillText('▶',IW-11,GROUND-38); }
  /* banner */
  if(G.banner){
    ctx.globalAlpha=Math.min(1,G.banner.t);
    ctx.font='8px "Press Start 2P",monospace';
    const b=G.banner.txt;
    ctx.fillStyle='#0c0a14'; ctx.fillText(b,F(IW/2-b.length*4)+1,61);
    ctx.fillStyle='#ffb347'; ctx.fillText(b,F(IW/2-b.length*4),60);
    ctx.globalAlpha=1;
  }
  /* tips */
  if(state==='play') for(const tip of TIPS){
    if(G.t>tip.at && G.t<tip.at+5.5){
      ctx.globalAlpha=Math.min(1,(G.t-tip.at)*2, (tip.at+5.5-G.t)*2);
      ctx.fillStyle='#0c0a14'; ctx.fillText(tip.txt,F(IW/2-tip.txt.length*4)+1,45);
      ctx.fillStyle='#e8d5a9'; ctx.fillText(tip.txt,F(IW/2-tip.txt.length*4),44);
      ctx.globalAlpha=1;
    }
  }
  /* respawn countdown */
  if(p.dead>0){
    ctx.fillStyle='#ff5a3c';
    const d='BACK IN '+Math.ceil(p.dead);
    ctx.fillText(d,F(IW/2-d.length*4),90);
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  if(state==='play' && !panelOpen && !document.hidden) update(dt);
  render();
}
requestAnimationFrame(loop);
</script>
